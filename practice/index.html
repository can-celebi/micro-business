<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microeconomics · midterm practice</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(../assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(../assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "STIX Two Text"; font-style: normal; font-display: swap; src: url(../assets/fonts/stix-two-text-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "STIX Two Text"; font-style: italic; font-display: swap; src: url(../assets/fonts/stix-two-text-latin-400-italic.woff2) format("woff2"); }
  :root { --bg: #fbfbf9; --card: #fff; --ink: #1d1d1f; --dim: #6b6f76; --line: #e3e5e8; --accent: #2f5d8c; --ok: #1b7f3b; --okbg: #e3f1e7; --no: #a12f2f; --nobg: #f8e6e6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 1.4rem 0 .5rem; }
  .sub { color: var(--dim); font-size: .85rem; margin: .2rem 0 1rem; }
  /* one sticky top bar (Oyun): crumbs left, "nickname · points ▾" right, one line */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; margin-bottom: 10px; }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: .9rem; white-space: nowrap; }
  .crumbs a { color: var(--accent); text-decoration: none; } .crumbs .sep { color: var(--dim); } .crumbs .c-mode { color: var(--ink); }
  button.crumb { border: 0; background: none; padding: 2px 2px; color: var(--accent); font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.mebtn { color: var(--ink); flex-shrink: 0; } #tot { font-variant-numeric: tabular-nums; } button.crumb:hover { background: #eef2f7; }
  .menu { position: absolute; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(20, 24, 30, .12); padding: 4px; display: grid; min-width: 12em; }
  .menu a, .menu button { display: flex; align-items: center; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--ink); text-decoration: none; text-align: left; font-size: .92rem; }
  .menu a:hover, .menu button:hover { background: #f0f3f7; } .menu .mrow-mid { color: var(--accent); }
  @media (max-width: 560px) { .crumbs .c-mid { display: none; } }
  /* the answer bar, pinned to the bottom after an answer */
  main { padding-bottom: 96px; }
  .abar { position: sticky; bottom: 0; z-index: 4; background: #fff; border-top: 1px solid var(--line); margin: 12px -16px 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .abar-in { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .abar .verdict { margin: 0; font-weight: 600; } .abar .abtn { display: flex; gap: 8px; margin-left: auto; } .abar button { min-height: 44px; }
  @media (max-width: 420px) { .abar .abtn { width: 100%; } .abar .abtn button { flex: 1; } }
  .qmeta .lvl { color: var(--ink); } .qmeta .pts { color: var(--ink); font-weight: 600; } #fb { color: var(--dim); } #fb.late { text-decoration: line-through; }
  .opt.wasw { background: #fff; border-color: #c9ced6; border-left: 3px solid var(--no); color: var(--dim); }
  @media (max-width: 560px) { .opt { min-height: 48px; } }
  .me { font-size: .88rem; color: var(--dim); } .me b { color: var(--ink); font-weight: 600; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid #c9ced6; background: #fff; color: var(--ink); padding: 8px 14px; }
  button:hover { background: #f0f3f7; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: .85rem; text-decoration: underline; }
  input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid #c9ced6; border-radius: 8px; width: 14em; max-width: 100%; }
  .cats { display: grid; gap: 10px; }
  .cat { text-align: left; padding: 12px 14px; display: grid; gap: 2px; }
  .cat .n { font-weight: 600; } .cat .d { font-size: .85rem; color: var(--dim); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .qmeta { font-size: .8rem; color: var(--dim); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .qtext { margin: 0 0 10px; }
  .stmts { list-style: none; padding: 0; margin: 4px 0 8px; } .stmts .r { display: inline-block; width: 2.2em; color: var(--dim); }
  .opts { display: grid; gap: 8px; margin: 10px 0 4px; }
  .opt { text-align: left; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; }
  .opt .l { color: var(--dim); min-width: 1.4em; }
  .opt.right { background: var(--okbg); border-color: var(--ok); } .opt.wrong { background: var(--nobg); border-color: var(--no); }
  .opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
  .m { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 1.08em; white-space: nowrap; } .m i { font-style: italic; }
  .m .w { font-family: "Inter", system-ui, sans-serif; font-style: normal; font-size: .86em; }
  .katex { font-size: 1.05em; white-space: nowrap; }
  .verdict { margin: 12px 0 6px; font-weight: 600; } .verdict.ok { color: var(--ok); } .verdict.no { color: var(--no); }
  .sol { font-size: .92rem; background: #f6f7f9; border-radius: 8px; padding: 8px 10px; }
  .sol .solh { font-size: .78rem; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .sol ol.steps { margin: 0 0 6px; padding-left: 1.4em; } .sol ol.steps li { margin: 3px 0; }
  .sol .ans { margin: 4px 0 0; font-weight: 600; }
  .fig { margin: 8px 0; } .fig svg.figsvg { width: 100%; max-width: 440px; height: auto; display: block; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .sol .expl { margin: 6px 0 0; }
  .next { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  table.lb { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.lb td, table.lb th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  table.lb th { font-weight: 600; color: var(--dim); font-size: .8rem; } table.lb td.p { text-align: right; font-variant-numeric: tabular-nums; }
  table.lb tr.mine td { background: #eef4fb; }
  .tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin-bottom: 8px; } .tabs button { flex-shrink: 0; } .tabs button { padding: 4px 10px; font-size: .85rem; } .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fine { font-size: .78rem; color: var(--dim); margin-top: 2rem; }
  .msg { font-size: .88rem; color: var(--dim); }
  .bad { color: var(--no); }
  .dir { margin: .2rem 0 .3rem; } .rule { font-size: .9rem; background: #eef4fb; border-radius: 8px; padding: 8px 10px; }
  .modes button { padding: 6px 16px; font-size: .92rem; }
  .startrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; } @media (max-width: 560px) { .startrow .go { width: 100%; } }
  button.big { font-size: 1.05rem; padding: 12px 22px; }
  .filters { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; margin: 6px 0 6px; padding-bottom: 2px; scrollbar-width: none; } .filters::-webkit-scrollbar { display: none; }
  .filters .pill { flex-shrink: 0; padding: 4px 12px; border-radius: 999px; font-size: .85rem; } .filters .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modes select { flex-shrink: 0; font: inherit; font-size: .85rem; padding: 4px 6px; border-radius: 8px; border: 1px solid #c9ced6; margin-left: auto; }
  h3.lvh { font-size: .88rem; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
  .modal { position: fixed; inset: 0; background: rgba(20, 24, 30, .35); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px; overflow-y: auto; z-index: 10; }
  .modal .fine { margin-top: .5rem; }
  .modal .card { max-width: 620px; width: 100%; position: relative; max-height: 90vh; overflow: auto; }
  .modal .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 1.4rem; line-height: 1; padding: 6px 10px; color: var(--dim); } .modal p { font-size: .92rem; } ol.tut { padding-left: 1.3em; } ol.tut li { margin: 6px 0; }
  .warn { font-size: .86rem; background: #fff4d6; border: 1px solid #e0b64a; border-radius: 8px; padding: 8px 10px; }
  .forms { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .forms h2 { margin: 0 0 .4rem; }
  .forms label { display: grid; gap: 2px; font-size: .85rem; color: var(--dim); margin-bottom: 8px; }
  .forms input { font: inherit; padding: 8px 10px; border: 1px solid #c9ced6; border-radius: 8px; width: 100%; color: var(--ink); }
  .cat:disabled { opacity: .55; cursor: default; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.4em, 1fr)); gap: 6px; }
  .qc { position: relative; display: grid; gap: 0; padding: 5px 2px; min-height: 44px; text-align: center; border-radius: 8px; }
  .qc .qn { font-weight: 600; font-size: .9rem; } .qc .qp { font-size: .78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .qc.done { background: var(--okbg); border-color: var(--okbg); } .qc.done .qp { color: var(--ok); } .qc.seen .qp { color: var(--dim); }
  .qc .qw { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--no); }
  @media (max-width: 560px) { .forms { grid-template-columns: 1fr; } }
  @media (pointer: coarse) { button.link, .crumbs a, button.crumb { min-height: 44px; display: inline-flex; align-items: center; } }
</style>
