  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }

  h1 { font-size: 1.3rem; font-weight: 600; margin: 0; }

  .links a:hover { background: var(--p-green); }
  .links .soon { color: var(--faint); border-color: #ddd; }
  .empty { color: var(--faint); font-size: .88rem; }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .card.ps { background: var(--p-yellow); border-style: dashed; }
  .card.ps .links a { background: #fff; }
  .live { margin: 1.2rem 0 .4rem; }
  .live a { display: inline-block; font-size: .95rem; padding: .45rem 1rem; background: #FFE0E0; border: 1.5px solid #D9480F; border-radius: 2px; border-bottom: 1.5px solid #D9480F; }
  .live a:hover { background: #FFC9C9; }
  .live .dim { font-size: .8rem; }
  .lock { font-size: .82rem; color: var(--dim); margin: -.8rem 0 1.4rem; }
