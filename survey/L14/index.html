<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>L14 risk games</title>
<link rel="stylesheet" href="../../assets/css/console-light.css?v=20261014a">
<style>
  /* readable font as in the decks (Can 11.11: no monospace); maths stays in .m */
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(../../assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(../../assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  html:root { --mono: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-size: 1.2rem; margin: 0; }
  h2 { font-size: .95rem; margin: 1.8rem 0 .2rem; border-top: 1.5px solid var(--line); padding-top: .7rem; }
  .s { color: var(--dim); font-size: .85rem; margin: .3rem 0 1rem; }
  .q { margin: 0 0 1.1rem; }
  .q .t { font-size: .92rem; margin-bottom: .4rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { font-family: var(--mono); font-size: .9rem; background: #fff; color: var(--ink); border: 1.5px solid #bbb; border-radius: 2px; padding: 6px 12px; cursor: pointer; }
  .opt.on { background: var(--p-green); border-color: var(--line); }
  .likert .opt { min-width: 44px; }
  .scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--dim); max-width: 300px; margin-top: 3px; }
  .chk { display: block; font-size: .88rem; margin: 6px 0; }
  .diff { margin: 2px 0 10px 1.6em; }
  textarea { font-family: var(--mono); font-size: .9rem; width: 100%; min-height: 4em; border: 1.5px solid #bbb; border-radius: 2px; padding: 6px; }
  .go { font-family: var(--mono); font-size: 1rem; padding: 10px 22px; background: var(--p-yellow); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; margin-top: .6rem; }
  .msg { margin-top: .8rem; font-size: .9rem; }
  .missing .t { color: var(--bad); }
  a { color: var(--ink); }
  .opt-note { font-size: .78rem; color: var(--dim); margin: .2rem 0 .3rem; }
  .opts.col { flex-direction: column; align-items: flex-start; }
  .m { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 1.05em; white-space: nowrap; } .m i { font-style: italic; } .m sub { font-size: .65em; vertical-align: -.25em; }
  /* L14 risk games (Ali 24.11; Carpenter's spec 85add7e2e90c, Hande's results spec) */
  @media (pointer: coarse) { .opt, .go, .num { min-height: 44px; } }
  .game { border: 1.5px solid var(--line); border-radius: 2px; padding: 12px; background: #fff; margin: .6rem 0 1rem; }
  .pot { font-size: 1rem; margin: .5rem 0; } .pot b { font-size: 1.2rem; }
  .boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-width: 330px; margin-bottom: .6rem; }
  .box { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: .85rem; background: #f3efe6; border: 1.5px solid #bbb; border-radius: 2px; }
  .box.on { background: var(--p-yellow); border-color: var(--line); } .box.bomb { background: var(--p-pink); border-color: var(--bad); font-weight: 600; }
  .nums { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 360px; }
  .num { font-family: var(--mono); font-size: .9rem; background: #fff; border: 1.5px solid #bbb; border-radius: 2px; padding: 6px 0; cursor: pointer; }
  .num.on { background: var(--p-green); border-color: var(--line); }
  .hl { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .hl td { border-top: 1px solid #ddd; padding: 5px 2px; vertical-align: middle; }
  .hl td:first-child { white-space: nowrap; color: var(--dim); padding-right: 6px; }
  .hl .opt { width: 100%; text-align: left; padding: 6px 8px; font-size: .8rem; }
  .hl tr.missing td:first-child { color: var(--bad); font-weight: 600; }
  /* results */
  .chart { margin: .3rem 0 .4rem; } .plot { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1.5px solid var(--line);
    background: repeating-linear-gradient(to top, transparent 0 37px, #eee 37px 38px); }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; cursor: pointer; min-width: 0; }
  .col .bb { background: var(--p-blue); border: 1px solid #7aa7cf; border-radius: 3px 3px 0 0; min-height: 0; }
  .col.grey { flex: 2.2; } .col.grey .bb { background: #ddd; border-color: #aaa; } .gap { width: 10px; flex: none; }
  .xl .gl { flex: 2.2; white-space: normal; line-height: 1.1; overflow: visible; }
  .xl { display: flex; gap: 2px; font-size: .68rem; color: var(--dim); margin-top: 2px; } .xl span { flex: 1; text-align: center; min-width: 0; overflow: hidden; }
  .xl .gap { width: 10px; } .xl.rp { color: var(--ink); }
  .vline { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--ink); pointer-events: none; }
  .vline span { position: absolute; top: -2px; left: 4px; font-size: .68rem; white-space: nowrap; background: var(--bg); }
  .axis { font-size: .75rem; color: var(--dim); text-align: center; margin-top: 2px; }
  .sides { display: flex; justify-content: space-between; font-size: .8rem; margin-top: 3px; }
  .meta { font-size: .78rem; color: var(--dim); margin: .2rem 0; } .tip { font-size: .8rem; min-height: 1.1em; }
  .reading { border-left: 3px solid var(--p-yellow); padding: 2px 8px; margin: .4rem 0 1.4rem; font-size: .88rem; }
  .same td, .same th { border: 1px solid #ccc; padding: 4px 8px; font-size: .8rem; text-align: center; } .same .dg { background: var(--p-green); }
  .phases { display: flex; flex-wrap: wrap; gap: 6px; margin: .4rem 0; } .phases .on { background: var(--p-green); border-color: var(--line); }
</style>
</head>
<body>
<main id="app"></main>
<script src="../../assets/js/config.js?v=20261124a"></script>
<script src="../../assets/js/interactive.js?v=20261029h"></script>
<script src="risk.js?v=20261124a"></script>
</body>
</html>
