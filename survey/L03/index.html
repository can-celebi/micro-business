<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Before We Start</title>
<link rel="stylesheet" href="../../assets/css/console-light.css?v=s5">
<style>
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-size: 1.2rem; margin: 0; }
  h2 { font-size: .95rem; margin: 1.8rem 0 .2rem; border-top: 1.5px solid var(--line); padding-top: .7rem; }
  .s { color: var(--dim); font-size: .85rem; margin: .3rem 0 1rem; }
  .q { margin: 0 0 1.1rem; }
  .q .t { font-size: .92rem; margin-bottom: .4rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { font-family: var(--mono); font-size: .9rem; background: #fff; color: var(--ink); border: 1.5px solid #bbb; border-radius: 2px; padding: 6px 12px; cursor: pointer; }
  .opt.on { background: var(--p-green); border-color: var(--line); }
  .likert .opt { min-width: 44px; }
  .scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--dim); max-width: 300px; margin-top: 3px; }
  .chk { display: block; font-size: .88rem; margin: 6px 0; }
  .diff { margin: 2px 0 10px 1.6em; }
  textarea { font-family: var(--mono); font-size: .9rem; width: 100%; min-height: 4em; border: 1.5px solid #bbb; border-radius: 2px; padding: 6px; }
  .go { font-family: var(--mono); font-size: 1rem; padding: 10px 22px; background: var(--p-yellow); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; margin-top: .6rem; }
  .msg { margin-top: .8rem; font-size: .9rem; }
  .missing .t { color: var(--bad); }
  a { color: var(--ink); }
</style>
</head>
<body>
<main id="app">
  <h1>&gt; before we start<span class="cursor"></span></h1>
  <p class="s">anonymous · about 2 minutes · microeconomics · lecture 3</p>
  <div id="f"></div>
  <button class="go" id="go" type="button">[ submit ]</button>
  <div class="msg" id="msg"></div>
</main>
<script src="../../assets/js/config.js?v=20261008j"></script>
<script src="../../assets/js/interactive.js?v=20261008j"></script>
<script>
// Opening survey L03. All answers go into ONE free-text record (git blob + tag ref, poll "L03-survey"),
// read by teacher/?l=L03 and Emre's report. The end-of-class check (L03-after-<id>) uses the same "today" ids.
// Last part (08.10): the slides and the interface: ui_chat, ui_pulse (1–5), ui_read (yes/maybe/no), ui_more (text), all optional.
// Problem set: per question you did, how hard (d<q>) + an optional text "what is hard" (hardq.<q>) (Can, 08.10).
const POLL = 'L03-survey';
const LIK = ['1','2','3','4','5'];
const LAST = [['alloc','allocation mechanisms'],['pc','perfect competition'],['barr','barriers to entry']];
const TODAY = [['dem','demand'],['invdem','inverse demand'],['law','law of demand'],['sup','supply'],['invsup','inverse supply'],['eq','equilibrium'],['ss','shortage and surplus']];
const PSQ = [['q1','Q1 musical ticket (a)'],['q2','Q2 musical ticket (b)'],['q3','Q3 Mr Schmidt (a)'],['q4','Q4 Mr Schmidt (b)'],['q5','Q5 course average'],['q6','Q6 Tom\'s boats (a)'],['q7','Q7 Tom\'s boats (b)'],['q8','Q8 the car from your parents']];
const ans = {}, f = document.getElementById('f');

function likert(id, label, lo, hi) {
  const d = document.createElement('div'); d.className = 'q likert'; d.id = 'q-' + id;
  d.innerHTML = '<div class="t">' + label + '</div>';
  const box = document.createElement('div'); box.className = 'opts';
  LIK.forEach(v => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = v; b.onclick = () => { ans[id] = v; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); }; box.appendChild(b); });
  d.appendChild(box); d.insertAdjacentHTML('beforeend', '<div class="scale"><span>1 · ' + lo + '</span><span>5 · ' + hi + '</span></div>');
  return d;
}
function choice(id, label, opts) {
  const d = document.createElement('div'); d.className = 'q'; d.id = 'q-' + id;
  d.innerHTML = '<div class="t">' + label + '</div>';
  const box = document.createElement('div'); box.className = 'opts';
  opts.forEach(([c, l]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = l; b.onclick = () => { ans[id] = c; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); }; box.appendChild(b); });
  d.appendChild(box); return d;
}
function head(t, s) { f.insertAdjacentHTML('beforeend', '<h2>' + t + '</h2>' + (s ? '<p class="s">' + s + '</p>' : '')); }

head('yesterday', 'how well do you understand these now?');
LAST.forEach(([id, l]) => f.appendChild(likert(id, l, 'not at all', 'very well')));
head('today', 'what do you already know about these? (we haven\'t done them yet: low numbers are normal)');
TODAY.forEach(([id, l]) => f.appendChild(likert(id, l, 'nothing', 'know it well')));
head('problem set 1', 'due Mon 12.10, 12:00 · this helps us see what to repeat');
f.appendChild(choice('ps', 'have you looked at problem set 1?', [['0','not yet'],['1','looked at it'],['2','started'],['3','done']]));
const psBox = document.createElement('div'); psBox.className = 'q'; psBox.id = 'q-done';
psBox.innerHTML = '<div class="t">which questions have you done or tried? <span class="dim">(tick all; then for each: how hard, and what is hard)</span></div>';
PSQ.forEach(([id, l]) => {
  const lab = document.createElement('label'); lab.className = 'chk';
  const cb = document.createElement('input'); cb.type = 'checkbox';
  lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + l)); psBox.appendChild(lab);
  const df = likert('d' + id, 'how hard was it?', 'easy', 'very hard'); df.classList.add('diff'); df.hidden = true; psBox.appendChild(df);
  // per question: what you don't understand / what is hard (optional)
  const tx = document.createElement('div'); tx.className = 'q diff'; tx.hidden = true;
  tx.innerHTML = '<div class="t">anything you don\'t understand, or what is hard? <span class="dim">(optional)</span></div><textarea class="hq" data-q="' + id + '" maxlength="300"></textarea>';
  tx.querySelector('textarea').addEventListener('keydown', e => e.stopPropagation());
  psBox.appendChild(tx);
  cb.onchange = () => { df.hidden = tx.hidden = !cb.checked; if (cb.checked) ans['did_' + id] = '1'; else { delete ans['did_' + id]; delete ans['d' + id]; } };
});
f.appendChild(psBox);
// the slides and the interface (Can, 08.10): optional, never blocks submit
head('the slides and the interface', 'optional · helps us improve the slides');
f.appendChild(likert('ui_chat', 'the chat ("ask the lecturer"): how useful is it?', 'not useful', 'very useful'));
f.appendChild(likert('ui_pulse', 'the pulse ("how are you doing"): how useful is it?', 'not useful', 'very useful'));
f.appendChild(choice('ui_read', 'would you like reading material for each topic, up to 10 pages?', [['yes','yes'],['maybe','maybe'],['no','no']]));
const more = document.createElement('div'); more.className = 'q'; more.id = 'q-ui_more';
more.innerHTML = '<div class="t">what else would help you? <span class="dim">(optional)</span></div><textarea id="ui_more" maxlength="300"></textarea>';
f.appendChild(more);
// a message to Mari (tutorial), optional (Can, 08.10): where do you struggle the most?
const mari = document.createElement('div'); mari.className = 'q'; mari.id = 'q-mari';
mari.innerHTML = '<h2>for Mari (tutorial)</h2><div class="t">a message to Mari: where do you struggle the most, what should the tutorial go over? <span class="dim">(optional)</span></div><textarea id="mari" maxlength="500"></textarea>';
f.appendChild(mari);


async function submit() {
  const msg = document.getElementById('msg');
  const need = [...LAST, ...TODAY].map(x => x[0]).concat(['ps']);
  PSQ.forEach(([id]) => { if (ans['did_' + id]) need.push('d' + id); });
  const missing = need.filter(id => !ans[id]);
  document.querySelectorAll('.q').forEach(d => d.classList.remove('missing'));
  missing.forEach(id => { const d = document.getElementById('q-' + id); if (d) d.classList.add('missing'); });
  if (missing.length) { msg.textContent = 'please answer all questions (' + missing.length + ' missing, in red)'; return; }
  const go = document.getElementById('go'); if (go.disabled) return; go.disabled = true;  // no double records from a double tap
  msg.textContent = 'saving…';
  try {
    const hardq = {};
    document.querySelectorAll('textarea.hq').forEach(t => { if (ans['did_' + t.dataset.q] && t.value.trim()) hardq[t.dataset.q] = t.value.trim(); });
    const um = document.getElementById('ui_more').value.trim(); if (um) ans.ui_more = um;
    const mm = document.getElementById('mari').value.trim(); if (mm) ans.mari = mm;
    await window.MicroPoll.submitText(POLL, { answers: ans, hardq: hardq }, n => msg.textContent = 'busy, retry ' + n + '…');
    msg.innerHTML = 'saved_ thank you! <br><a href="../../lectures/L03/index.html">→ back to the slides</a>';
    document.getElementById('go').style.display = 'none';
  } catch (e) { msg.textContent = 'not saved (offline?). please try again'; go.disabled = false; }
}
document.getElementById('go').onclick = submit;
</script>
</body>
</html>
