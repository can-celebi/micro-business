<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Before We Start</title>
<link rel="stylesheet" href="../../assets/css/console-light.css?v=20261014a">
<style>
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-size: 1.2rem; margin: 0; }
  h2 { font-size: .95rem; margin: 1.8rem 0 .2rem; border-top: 1.5px solid var(--line); padding-top: .7rem; }
  .s { color: var(--dim); font-size: .85rem; margin: .3rem 0 1rem; }
  .q { margin: 0 0 1.1rem; }
  .q .t { font-size: .92rem; margin-bottom: .4rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { font-family: var(--mono); font-size: .9rem; background: #fff; color: var(--ink); border: 1.5px solid #bbb; border-radius: 2px; padding: 6px 12px; cursor: pointer; }
  .opt.on { background: var(--p-green); border-color: var(--line); }
  .likert .opt { min-width: 44px; }
  .scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--dim); max-width: 300px; margin-top: 3px; }
  .chk { display: block; font-size: .88rem; margin: 6px 0; }
  .diff { margin: 2px 0 10px 1.6em; }
  textarea { font-family: var(--mono); font-size: .9rem; width: 100%; min-height: 4em; border: 1.5px solid #bbb; border-radius: 2px; padding: 6px; }
  .go { font-family: var(--mono); font-size: 1rem; padding: 10px 22px; background: var(--p-yellow); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; margin-top: .6rem; }
  .msg { margin-top: .8rem; font-size: .9rem; }
  .missing .t { color: var(--bad); }
  a { color: var(--ink); }
  .opt-note { font-size: .78rem; color: var(--dim); margin: .2rem 0 .3rem; }
</style>
</head>
<body>
<main id="app">
  <h1>&gt; before we start<span class="cursor"></span></h1>
  <p class="s">anonymous · about 4 minutes · microeconomics · lecture 8</p>
  <div id="f"></div>
  <button class="go" id="go" type="button">[ submit ]</button>
  <div class="msg" id="msg"></div>
</main>
<script src="../../assets/js/config.js?v=20261014a"></script>
<script src="../../assets/js/interactive.js?v=20261014a"></script>
<script>
// Opening survey L08 (Can, 28.10): (1) how clear is each concept, one item per concept (Kamuran R19): last time's and
// today's, 1 = never heard of it … 5 = I could explain it; (2) is it unfair that our group deviates from the German group
// (different problem sets, different exam questions): to you? to them? 1 = not at all … 5 = very, each with an optional
// comment. ONE record per student (poll "L08-survey"), read by the deck's results slide (Filiz). Field keys (Filiz's
// slide): ic, mrs, budget, best, subs, comp, util; unfair_you, unfair_them; c_you, c_them (optional text); topics below.
const POLL = 'L08-survey';
const LIK = ['1','2','3','4','5'];
const CONCEPTS = [['ic','indifference curves'],['mrs','the marginal rate of substitution (MRS)'],['budget','the budget line'],
  ['best','the best feasible bundle'],['subs','perfect substitutes'],['comp','perfect complements'],['util','utility functions']];
// the rest of the semester (Can, 28.10, ~18:00): for each topic "heard of it?" (yes/no) and "interested?" (1–5), then
// one item "prefer these to firms in perfect competition?" (yes/no/no opinion). Keys: heard_<id> = yes|no,
// int_<id> = 1–5, prefer = yes|no|none. Topic ids below.
const TOPICS = [['games','basic game theory'],['search','search theory'],['curse','the winner\'s curse'],['altruism','altruism'],
  ['risk','choice under uncertainty'],['prospect','prospect theory']];
const ans = {}, txt = {}, f = document.getElementById('f');

function likert(id, label, lo, hi) {
  const d = document.createElement('div'); d.className = 'q likert'; d.id = 'q-' + id;
  d.innerHTML = '<div class="t">' + label + '</div>';
  const box = document.createElement('div'); box.className = 'opts';
  LIK.forEach(v => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = v; b.onclick = () => { ans[id] = v; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); }; box.appendChild(b); });
  d.appendChild(box); d.insertAdjacentHTML('beforeend', '<div class="scale"><span>1 · ' + lo + '</span><span>5 · ' + hi + '</span></div>');
  return d;
}
function comment(id) {
  const d = document.createElement('div'); d.className = 'q';
  d.innerHTML = '<div class="opt-note">comment (optional)</div>';
  const t = document.createElement('textarea'); t.maxLength = 400; t.rows = 2; t.oninput = () => { txt[id] = t.value; };
  d.appendChild(t); return d;
}
function choice(id, label, opts) {
  const d = document.createElement('div'); d.className = 'q'; d.id = 'q-' + id;
  d.innerHTML = '<div class="t">' + label + '</div>';
  const box = document.createElement('div'); box.className = 'opts';
  opts.forEach(([c, l]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = l; b.onclick = () => { ans[id] = c; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); }; box.appendChild(b); });
  d.appendChild(box); return d;
}
function head(t, s) { f.insertAdjacentHTML('beforeend', '<h2>' + t + '</h2>' + (s ? '<p class="s">' + s + '</p>' : '')); }

head('the concepts', 'how clear is each one to you?');
CONCEPTS.forEach(([id, l]) => f.appendChild(likert(id, l, 'never heard of it', 'I could explain it')));
head('our group and the other group', '');
f.appendChild(likert('unfair_you', 'Our group has its own problem sets and exam questions. Is that unfair to you?', 'not at all', 'very'));
f.appendChild(comment('c_you'));
f.appendChild(likert('unfair_them', 'Our group has its own problem sets and exam questions. Is that unfair to the other group?', 'not at all', 'very'));
f.appendChild(comment('c_them'));
head('the rest of the semester', 'These are all very important topics, and we can study each of them at a basic level. We will still study firms: how a firm turns inputs into output and how it picks the cheapest mix of inputs, which gives its costs – the same logic as the consumer\'s best bundle. Then we look at how a few firms compete with each other (oligopoly); what we leave out is the market-level picture with many competing firms (perfect competition and long-run industry supply). Instead, we will do more on how people decide: preferences, time, risk and altruism.');
TOPICS.forEach(([id, l]) => {
  f.appendChild(choice('heard_' + id, l + ': have you heard of it?', [['yes', 'yes'], ['no', 'no']]));
  f.appendChild(likert('int_' + id, l + ': how interested are you?', 'not at all', 'very'));
});
f.appendChild(choice('prefer', 'Would you prefer these topics to firms in perfect competition?', [['yes', 'yes'], ['no', 'no'], ['none', 'no opinion']]));

async function submit() {
  const msg = document.getElementById('msg');
  const need = CONCEPTS.map(x => x[0]).concat(['unfair_you', 'unfair_them'], TOPICS.flatMap(([id]) => ['heard_' + id, 'int_' + id]), ['prefer']);
  const missing = need.filter(id => !ans[id]);
  document.querySelectorAll('.q').forEach(d => d.classList.remove('missing'));
  missing.forEach(id => { const d = document.getElementById('q-' + id); if (d) d.classList.add('missing'); });
  if (missing.length) { msg.textContent = 'please answer all scales (' + missing.length + ' missing, in red); the comments are optional'; return; }
  const go = document.getElementById('go'); if (go.disabled) return; go.disabled = true;  // no double records from a double tap
  msg.textContent = 'saving…';
  const comments = {}; ['c_you', 'c_them'].forEach(k => { const v = (txt[k] || '').trim(); if (v) comments[k] = v; });
  try {
    await window.MicroPoll.submitText(POLL, { answers: ans, comments: comments }, n => msg.textContent = 'busy, retry ' + n + '…');
    msg.innerHTML = 'saved, thank you! <br><a href="../../lectures/L08/index.html" target="_top">→ back to the slides</a>';
    go.style.display = 'none';
  } catch (e) { msg.textContent = 'not saved (offline?). please try again'; go.disabled = false; }
}
document.getElementById('go').onclick = submit;
</script>
</body>
</html>
