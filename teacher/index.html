<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Lecturer View</title>
<link rel="stylesheet" href="../assets/css/console-light.css?v=t5">
<style>
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 80px; }
  h1 { font-size: 1.1rem; margin: 0; } h2 { font-size: .95rem; margin: 1.6rem 0 .4rem; border-top: 1.5px solid var(--line); padding-top: .6rem; }
  h3 { font-size: .85rem; margin: 1rem 0 .3rem; }
  .s { color: var(--dim); font-size: .8rem; margin: .3rem 0 .8rem; }
  .go { font-family: var(--mono); font-size: 1rem; padding: 8px 18px; background: var(--p-yellow); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; }
  .bar-row { font-size: .8rem; grid-template-columns: 7.5em 1fr 5.5em; }
  label { font-size: .8rem; margin-left: .8em; }
  .txt { font-size: .8rem; border-left: 3px solid var(--p-blue); padding: 2px 8px; margin: 4px 0; }
  .mean { font-size: .8rem; }
  details summary { cursor: pointer; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>&gt; lecturer view<span class="cursor"></span></h1>
  <p class="s" id="sub">loading…</p>
  <button class="go" id="go">[ refresh ]</button>
  <label><input type="checkbox" id="recent"> pulse: only the last 15 minutes</label>
  <div id="out"></div>
</main>
<script src="../assets/js/config.js?v=t5"></script>
<script src="../assets/js/interactive.js?v=t5"></script>
<script>
// Teacher view for Can's phone: teacher/?l=L02. Nothing updates by itself: press [ refresh ].
const L = (new URLSearchParams(location.search).get('l') || 'L02').toUpperCase();
const out = document.getElementById('out');
const PULSE = [
  ['confusion', 'confusion', ['1','2','3','4','5'], '1 I follow · 5 I\'m lost (old "understanding" taps shown as 6 − value)'],
  ['tired', 'tiredness', ['1','2','3','4','5'], '1 fresh · 5 exhausted'],
  ['pace', 'pace', ['1','2','3','4','5'], '1 too slow · 3 right · 5 too fast'],
  ['finish', 'finish when?', ['now','+10 min','+20 min','full time'], ''],
];
const LBL = {
  last: [['l1','scarcity'],['l2','cost–benefit'],['l3','reservation price'],['l4','explicit/implicit'],['l5','opportunity cost'],['l6','interest on money'],['l7','sunk cost'],['l8','marginal vs average'],['l9','MB ≥ MC'],['l10','positive/normative']],
  today: [['alloc','allocation'],['pc','perfect comp.'],['barr','barriers'],['dec','decentralisation'],['dem','demand'],['invdem','inverse demand'],['sup','supply'],['invsup','inverse supply'],
          ['eq','equilibrium'],['ss','shortage/surplus'],['shift','shift vs movement'],['sc','subst./compl.'],['tax','per-unit tax'],['incid','who pays a tax'],['surplus','CS / PS'],['dwl','deadweight loss']],
  about: [['crypto','own any crypto?',[['y','yes'],['n','no'],['x','prefer not']]],['mining','know bitcoin mining?',[['0','never heard'],['1','heard of it'],['2','could explain']]],['bill','pay own electricity bill?',[['y','yes'],['n','no'],['u','don\'t know']]]],
  psq: [['q1','Q1 musical (a)'],['q2','Q2 musical (b)'],['q3','Q3 Schmidt (a)'],['q4','Q4 Schmidt (b)'],['q5','Q5 average'],['q6','Q6 boats (a)'],['q7','Q7 boats (b)'],['q8','Q8 car']],
};
// per lecture: which concepts the opening survey asks (yesterday / today); default = the L02 lists above
const BY = { L03: { last: [['alloc','allocation'],['pc','perfect comp.'],['barr','barriers']], today: [['dem','demand'],['invdem','inverse demand'],['law','law of demand'],['sup','supply'],['invsup','inverse supply'],['eq','equilibrium'],['ss','shortage/surplus']] } };
// everything that comes from the data repo is escaped (anyone with the site token can write refs)
const E = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = v => String(v).replace(/[^A-Za-z0-9.-]/g, '_').replace(/\.+$/, '').slice(0, 40);
function bars(box, labels, counts, n, names) {
  labels.forEach((k, i) => {
    const pct = n ? 100 * (counts[k] || 0) / n : 0;
    box.insertAdjacentHTML('beforeend', `<div class="bar-row"><span class="bar-label">${E((names || labels)[i])}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bar-n">${Math.round(pct)}% (${counts[k] || 0})</span></div>`);
  });
}
const hm = ts => new Date(ts).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
async function draw() {
  out.innerHTML = '<p class="s">loading…</p>';
  const recent = document.getElementById('recent').checked, cutoff = Date.now() - 15 * 60 * 1000;
  try {
    const [all, texts, pulseAll] = await Promise.all([MicroPoll.allResults(L + '-'), MicroPoll.textResults(L + '-survey').then(a => MicroPoll.textResults(L + '-ow-').then(b => a.concat(b))), MicroPoll.allAnswers(L + '-pulse-')]);
    // pulse: class time only (18:30–20:00 of the lecture day, config.js); each device's latest tap inside it
    const win = MicroPoll.classWindow(L);
    out.innerHTML = '';
    document.getElementById('sub').textContent = L + ' · session ' + MicroPoll.session + ' · updated ' + hm(Date.now());
    // pulse
    let h = document.createElement('div'); h.innerHTML = '<h2>pulse <span class="dim">· ' + (win ? hm(win[0]) + '–' + hm(win[1]) + ' only' : 'all taps') + '</span></h2>'; out.appendChild(h);
    PULSE.forEach(([id, name, opts, ends]) => {
      const latest = {};
      const src = (pulseAll[L + '-pulse-' + id] || []).concat(id === 'confusion' ? (pulseAll[L + '-pulse-understand'] || []).map(r => Object.assign({}, r, { value: 6 - r.value })) : []);
      src.forEach(r => { if (win && (r.ts < win[0] || r.ts > win[1])) return; if (!latest[r.client] || latest[r.client].ts < r.ts) latest[r.client] = r; });
      let rows = Object.values(latest);
      if (recent) rows = rows.filter(r => r.ts >= cutoff);
      const counts = {}; rows.forEach(r => counts[String(r.value)] = (counts[String(r.value)] || 0) + 1);
      const nums = rows.map(r => Number(r.value)).filter(isFinite);
      const box = document.createElement('div');
      box.innerHTML = `<h3>${name} <span class="dim">· n = ${rows.length}${nums.length ? ' · mean ' + (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : ''}${rows.length ? ' · last ' + hm(Math.max(...rows.map(r => r.ts))) : ''}</span></h3>${ends ? '<div class="dim" style="font-size:.7rem">' + ends + '</div>' : ''}`;
      bars(box, opts.map(safe), counts, rows.length, opts);
      out.appendChild(box);
    });
    // opening survey (JSON texts)
    const surv = texts.filter(t => t.poll === L + '-survey');
    if (surv.length) {
      const n = surv.length, A = surv.map(s => s.answers || {});
      const mean = k => { const v = A.map(a => Number(a[k])).filter(isFinite); return v.length ? (v.reduce((x, y) => x + y, 0) / v.length).toFixed(1) : '–'; };
      h = document.createElement('div'); h.innerHTML = `<h2>opening survey <span class="dim">· n = ${n}</span></h2>`; out.appendChild(h);
      const sec = (title, ids) => {
        const box = document.createElement('div'); box.innerHTML = `<h3>${title} <span class="dim">· mean of 1–5</span></h3>`;
        ids.forEach(([k, l]) => { const m = mean(k); if (m === '–') return; const pct = 100 * Number(m) / 5;
          box.insertAdjacentHTML('beforeend', `<div class="bar-row"><span class="bar-label">${l}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bar-n">${m}</span></div>`); });
        out.appendChild(box);
      };
      sec('last class: understood now', (BY[L] || LBL).last); sec('today: known already', (BY[L] || LBL).today);
      LBL.about.forEach(([k, l, o]) => { const c = {}; A.forEach(a => { if (a[k] !== undefined) c[a[k]] = (c[a[k]] || 0) + 1; }); if (!Object.keys(c).length) return;
        const box = document.createElement('div'); box.innerHTML = `<h3>${l}</h3>`; bars(box, o.map(x => x[0]), c, n, o.map(x => x[1])); out.appendChild(box); });
      const c = {}; A.forEach(a => { if (a.ps !== undefined) c[a.ps] = (c[a.ps] || 0) + 1; });
      if (Object.keys(c).length) { const box = document.createElement('div'); box.innerHTML = '<h3>problem set 1: looked at it?</h3>'; bars(box, ['0','1','2','3'], c, n, ['not yet','looked at it','started','done']); out.appendChild(box); }
      const box = document.createElement('div'); box.innerHTML = '<h3>problem set 1: questions done · difficulty (1 easy · 5 very hard)</h3>';
      LBL.psq.forEach(([q, l]) => { const did = A.filter(a => a['did_' + q]).length; if (!did && !LBL.psq) return; const pct = 100 * did / n;
        box.insertAdjacentHTML('beforeend', `<div class="bar-row"><span class="bar-label">${l}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bar-n">${Math.round(pct)}% (${did}) · ${mean('d' + q)}</span></div>`); });
      out.appendChild(box);
      // per question: what is hard (L03 on)
      LBL.psq.forEach(([q, l]) => { const t = surv.map(s => (s.hardq || {})[q]).filter(Boolean); if (!t.length) return;
        const d = document.createElement('details'); d.innerHTML = `<summary>${l}: what is hard (${t.length})</summary>` + t.map(x => `<div class="txt">${E(x)}</div>`).join(''); out.appendChild(d); });
      // the slides and the interface (L03 on, optional)
      const ui = [['ui_chat', 'the chat: how useful? (1–5)'], ['ui_pulse', 'the pulse: how useful? (1–5)']].filter(([k]) => A.some(a => a[k] !== undefined));
      const rd = {}; A.forEach(a => { if (a.ui_read) rd[a.ui_read] = (rd[a.ui_read] || 0) + 1; });
      if (ui.length || Object.keys(rd).length || A.some(a => a.ui_more)) {
        const box = document.createElement('div'); box.innerHTML = '<h3>the slides and the interface</h3>';
        ui.forEach(([k, l]) => { const m = mean(k); if (m === '–') return; box.insertAdjacentHTML('beforeend', `<div class="bar-row"><span class="bar-label">${l}</span><span class="bar-track"><span class="bar-fill" style="width:${100 * Number(m) / 5}%"></span></span><span class="bar-n">${m}</span></div>`); });
        if (Object.keys(rd).length) { box.insertAdjacentHTML('beforeend', '<div class="dim">reading material for each topic (up to 10 pages)?</div>'); bars(box, ['yes', 'maybe', 'no'], rd, Object.values(rd).reduce((x, y) => x + y, 0)); }
        out.appendChild(box);
        const t = A.map(a => a.ui_more).filter(Boolean);
        if (t.length) { const d = document.createElement('details'); d.innerHTML = `<summary>what else would help (${t.length})</summary>` + t.map(x => `<div class="txt">${E(x)}</div>`).join(''); out.appendChild(d); }
      }
      const hard = surv.map(s => s.hard).filter(Boolean);
      if (hard.length) { const d = document.createElement('details'); d.innerHTML = `<summary>what was hard in the problem set (${hard.length})</summary>` + hard.map(x => `<div class="txt">${E(x)}</div>`).join(''); out.appendChild(d); }
    }
    // polls on the slides
    h = document.createElement('div'); h.innerHTML = '<h2>polls on the slides</h2>'; out.appendChild(h);
    Object.keys(all).filter(p => p.indexOf('-pulse-') < 0).sort().forEach(p => {
      const rows = all[p], counts = {}; rows.forEach(r => counts[String(r.value)] = (counts[String(r.value)] || 0) + 1);
      const box = document.createElement('div'); box.innerHTML = `<h3>${E(p)} <span class="dim">· n = ${rows.length}</span></h3>`;
      const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 8);
      bars(box, keys, counts, rows.length, keys.map(k => k.replace(/_/g, ' ')));
      out.appendChild(box);
    });
    // own words (texts)
    const ow = texts.filter(t => t.poll.indexOf(L + '-ow-') === 0);
    if (ow.length) {
      h = document.createElement('div'); h.innerHTML = `<h2>own words <span class="dim">· ${ow.length} answers</span></h2>`; out.appendChild(h);
      const by = {}; ow.forEach(t => (by[t.poll] = by[t.poll] || []).push(t));
      Object.keys(by).sort().forEach(p => {
        const d = document.createElement('details'), list = by[p], sk = list.filter(t => t.skipped).length;
        d.innerHTML = `<summary>${E(p.replace(L + '-ow-', ''))} · ${list.length - sk} answers, ${sk} skipped</summary>` + list.filter(t => !t.skipped).map(t => `<div class="txt">${E(t.text)}</div>`).join('');
        out.appendChild(d);
      });
    }
  } catch (e) { out.innerHTML = '<p class="s">could not load (offline?)</p>'; }
}
document.getElementById('go').onclick = draw;
draw();
</script>
</body>
</html>
