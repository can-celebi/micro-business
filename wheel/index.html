<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Wheel of Fortune</title>
<link rel="stylesheet" href="../assets/css/console-light.css?v=w3">
<style>
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; text-align: center; }
  .three { display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; gap: 20px; align-items: start; }
  .side { text-align: left; font-size: .85rem; padding-top: 10px; }
  .side h2 { font-size: .9rem; margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1.5px solid var(--line); }
  .side.here h2 { color: #2a7a2a; } .side.away h2 { color: #b33; }
  .side div { padding: 3px 0; border-bottom: 1px dotted #ddd; cursor: pointer; }
  .side div:hover { text-decoration: line-through; }
  .side .t { color: var(--dim); font-size: .72rem; }
  @media (max-width: 900px) { .three { grid-template-columns: 1fr 1fr; } .three .mid { grid-column: 1 / -1; grid-row: 1; } }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .wheelbox { position: relative; max-width: 520px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--ink); }
  .name { font-size: 2.4rem; font-weight: 600; min-height: 3.2rem; margin: 12px 0 8px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .b { font-family: var(--mono); font-size: 1.05rem; padding: 10px 20px; border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; background: #fff; }
  .b.spin { background: var(--p-yellow); font-size: 1.3rem; padding: 12px 34px; }
  .b.here { background: var(--p-green); } .b.away { background: var(--p-pink); }
  .b:disabled { opacity: .35; cursor: default; }
  .count { color: var(--dim); font-size: .8rem; margin-top: 14px; }
  .foot { margin-top: 26px; font-size: .72rem; color: var(--dim); }
  .link { background: none; border: none; color: var(--dim); text-decoration: underline; cursor: pointer; font-family: var(--mono); font-size: .72rem; padding: 0; }
</style>
</head>
<body>
<main>
  <h1>&gt; wheel of fortune</h1>
  <div class="three">
  <div class="side here"><h2>here ✓ <span id="nh"></span></h2><div id="listhere" style="cursor:default;border:0;padding:0"></div></div>
  <div class="mid">
  <div class="wheelbox"><div class="pointer"></div><canvas id="c" width="900" height="900"></canvas></div>
  <div class="name" id="name">&nbsp;</div>
  <div class="row">
    <button class="b spin" id="spin">[ spin ]</button>
    <button class="b here" id="here" disabled>here ✓</button>
    <button class="b away" id="away" disabled>not here ✗</button>
  </div>
  <div class="count" id="count"></div>
  </div>
  <div class="side away"><h2>not here ✗ <span id="na"></span></h2><div id="listaway" style="cursor:default;border:0;padding:0"></div></div>
  </div>
  <div class="foot">
    <span id="lock" hidden>teacher code: <input type="password" id="code" size="12" style="font-family:var(--mono)"> <button class="link" id="open">open</button> · </span>
    <button class="link" id="export">download today</button> · <button class="link" id="reset">start over today</button>
  </div>
</main>
<script src="roster.enc.js?v=w4"></script>
<script>
// Wheel of fortune for cold-calling (Can, 07.10: "super simple: the list, spin, here or not here").
// The class list is built in (wheel/roster.enc.js, made by tools/roster_encrypt.py), ENCRYPTED with the teacher code,
// because the site is public. It opens by itself in a browser where the teacher code was entered (deck: T + code),
// otherwise type the code once below the wheel. "here" and "not here" both take the name off
// the wheel for today; "download today" saves who was here as a CSV.
const K = { names: 'wheel-names', day: d => 'wheel-class-' + d };
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const day = new Date().toISOString().slice(0, 10);
let names = [];
let cls = ls.get(K.day(day)) || [];   // [{name, status: 'here'|'away', t}]
let current = null, angle = 0, spinning = false;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const COLS = ['#E6F5E6', '#FFF9D0', '#FDE4E6', '#E4EFFA', '#F1E6FA', '#E6F3F5'];
const $ = id => document.getElementById(id);

function remaining() { const done = new Set(cls.map(x => x.name)); return names.filter(n => !done.has(n) && n !== current); }  // picked = off today's wheel at once
function save() { ls.set(K.day(day), cls); }
function draw() {
  const R = remaining(), W = cv.width, c = W / 2, r = W / 2 - 10;
  ctx.clearRect(0, 0, W, W);
  if (!R.length) { ctx.font = '600 40px IBM Plex Mono, monospace'; ctx.fillStyle = '#777'; ctx.textAlign = 'center'; ctx.fillText(names.length ? 'everyone has been called' : 'teacher code ↓', c, c); return; }
  const seg = 2 * Math.PI / R.length;
  R.forEach((n, i) => {
    const a0 = angle + i * seg;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = COLS[i % COLS.length]; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = R.length > 60 ? 0.5 : 1.5; ctx.stroke();
    ctx.save(); ctx.translate(c, c); ctx.rotate(a0 + seg / 2); ctx.textAlign = 'right'; ctx.fillStyle = '#111';
    const fs = Math.max(9, Math.min(28, 900 / R.length)); ctx.font = fs + 'px IBM Plex Mono, monospace';
    ctx.fillText(n.length > 24 ? n.slice(0, 23) + '…' : n, r - 14, fs / 3); ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c, c, 34, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
}
function picked() {
  const R = remaining(), seg = 2 * Math.PI / R.length;   // the pointer sits at the top (−π/2)
  let a = (-Math.PI / 2 - angle) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI;
  return R[Math.floor(a / seg) % R.length];
}
function spin() {
  if (spinning || current || !remaining().length) return;
  spinning = true; buttons(); $('name').innerHTML = '&nbsp;';
  const start = angle, total = 2 * Math.PI * (5 + Math.random() * 3) + Math.random() * 2 * Math.PI, dur = 4000, t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur); angle = start + total * (1 - Math.pow(1 - t, 3)); draw();
    if (t < 1) requestAnimationFrame(step); else { spinning = false; current = picked(); $('name').textContent = current; draw(); buttons(); }
  })(t0);
}
function mark(status) {
  if (!current) return;
  cls.push({ name: current, status: status, t: new Date().toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' }) });
  save(); current = null; render();
  if (status === 'away') spin();
}
function buttons() { $('spin').disabled = spinning || !!current || !remaining().length; $('here').disabled = $('away').disabled = !current; }
function render() {
  draw(); buttons(); if (!current) $('name').innerHTML = '&nbsp;';
  const here = cls.filter(x => x.status === 'here').length;
  // the two lists left and right, newest on top; click a name to put it back on the wheel (a mistake)
  const item = x => `<div data-n="${x.name.replace(/"/g, '&quot;')}" title="click: back on the wheel">${x.name.replace(/</g, '&lt;')} <span class="t">${x.t}</span></div>`;
  $('listhere').innerHTML = cls.filter(x => x.status === 'here').slice().reverse().map(item).join('');
  $('listaway').innerHTML = cls.filter(x => x.status === 'away').slice().reverse().map(item).join('');
  $('nh').textContent = here ? '(' + here + ')' : ''; $('na').textContent = cls.length - here ? '(' + (cls.length - here) + ')' : '';
  document.querySelectorAll('.side div[data-n]').forEach(d => d.onclick = () => { if (spinning) return; cls = cls.filter(x => x.name !== d.dataset.n); save(); render(); });
  $('count').textContent = names.length ? `here ${here} · not here ${cls.length - here} · on the wheel ${remaining().length}` : '';
}
// u:space list: "No.<tab>Surname, First name, 12345678" → "First name Surname" (the number is dropped);
// otherwise a Moodle export (first name / last name columns) or one name per line
function parseList(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const us = lines.map(l => l.split('\t')).filter(c => c.length >= 2 && /^\d+$/.test(c[0].trim()) && /,.*,\s*\d{6,}\s*$/.test(c[1]));
  if (us.length >= 3) return us.map(c => { const p = c[1].split(',').map(s => s.trim()); return (p[1] + ' ' + p[0]).trim(); });
  const split = l => l.split(/[,;\t]/).map(s => s.replace(/"/g, '').trim());
  const head = split(lines[0]).map(h => h.toLowerCase());
  const fi = head.findIndex(h => /first ?name|vorname/.test(h)), la = head.findIndex(h => /last ?name|nachname|surname/.test(h));
  if (fi >= 0 && la >= 0) return lines.slice(1).map(split).map(r => ((r[fi] || '') + ' ' + (r[la] || '')).trim()).filter(Boolean);
  return lines.map(l => l.trim()).filter(Boolean);
}
// open the built-in list with the teacher code (the one the deck stores, or typed here once)
async function unlock(code) {
  const E = window.ROSTER_ENC; if (!E || !code) return false;
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(E.salt), iterations: E.rounds, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const list = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(E.iv) }, key, b(E.ct))));
    names = list; try { localStorage.setItem('micro-teacher-code', code.trim()); } catch (e) {}
    $('lock').hidden = true; render(); return true;
  } catch (e) { return false; }
}
$('open').onclick = async () => { if (!(await unlock($('code').value))) { $('code').value = ''; $('code').placeholder = 'wrong code'; } };
$('code').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') $('open').click(); });
$('spin').onclick = spin; $('here').onclick = () => mark('here'); $('away').onclick = () => mark('away');
$('reset').onclick = () => { cls = []; current = null; save(); render(); };
$('export').onclick = () => {
  const csv = 'date,name,status,time\n' + cls.map(x => [day, '"' + x.name.replace(/"/g, '""') + '"', x.status === 'here' ? 'here' : 'not here', x.t].join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'wheel-' + day + '.csv'; a.click();
};
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); spin(); } if (e.key === 'y') mark('here'); if (e.key === 'n') mark('away'); });
names = [];  // never from an old loaded file: always the built-in list
render();
unlock(localStorage.getItem('micro-teacher-code') || '').then(ok => { if (!ok) { $('lock').hidden = false; render(); } });
</script>
</body>
</html>
