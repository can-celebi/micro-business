<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Wheel of Fortune</title>
<link rel="stylesheet" href="../assets/css/console-light.css?v=20261014a">
<style>
  body { margin: 0; font-family: var(--mono); color: var(--ink); background: var(--bg); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; text-align: center; }
  .three { display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; gap: 20px; align-items: start; }
  .side { text-align: left; font-size: .85rem; padding-top: 10px; }
  .side h2 { font-size: .9rem; margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1.5px solid var(--line); }
  .side div { padding: 3px 0; border-bottom: 1px dotted #ddd; cursor: pointer; }
  .side div:hover { text-decoration: line-through; }
  .side .t { color: var(--dim); font-size: .72rem; }
  @media (max-width: 900px) { .three { grid-template-columns: 1fr 1fr; } .three .mid { grid-column: 1 / -1; grid-row: 1; } }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .wheelbox { position: relative; max-width: 520px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--ink); }
  .name { font-size: 2.4rem; font-weight: 600; min-height: 3.2rem; margin: 12px 0 8px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .b { font-family: var(--mono); font-size: 1.05rem; padding: 10px 20px; border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; background: #fff; }
  .b.spin { background: var(--p-yellow); font-size: 1.3rem; padding: 12px 34px; }
  .b:disabled { opacity: .35; cursor: default; }
  .count { color: var(--dim); font-size: .8rem; margin-top: 14px; }
  .foot { margin-top: 26px; font-size: .72rem; color: var(--dim); }
  /* the called list is kept on this device for today but not listed on screen (Can, 08.10) */
  .side { display: none; }
  .three { grid-template-columns: minmax(0, 560px); justify-content: center; }
  /* compact: inside the deck's small box (top-left over the slide) */
  body.compact main { padding: 4px 8px 8px; }
  body.compact h1 { display: none; }
  body.compact .wheelbox { max-width: 200px; }
  body.compact .pointer { border-left-width: 10px; border-right-width: 10px; border-top-width: 18px; }
  body.compact .name { font-size: 1.2rem; min-height: 1.6rem; margin: 4px 0 4px; }
  body.compact .b { font-size: .8rem; padding: 6px 10px; } body.compact .b.spin { font-size: .9rem; padding: 6px 16px; }
  body.compact .row { gap: 6px; }
  body.compact .count { margin-top: 6px; font-size: .7rem; } body.compact .foot { margin-top: 8px; font-size: .65rem; }
  .who { margin: 10px 0 2px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .who .b { font-size: .85rem; padding: 6px 12px; } .who .b.on { background: var(--p-green); }
  .src { color: var(--dim); font-size: .78rem; margin-top: 6px; }
  body.compact .who .b { font-size: .7rem; padding: 4px 8px; } body.compact .src { font-size: .62rem; margin-top: 3px; }
  .link { background: none; border: none; color: var(--dim); text-decoration: underline; cursor: pointer; font-family: var(--mono); font-size: .72rem; padding: 0; }
</style>
</head>
<body>
<main>
  <h1>&gt; wheel of fortune</h1>
  <div class="three">
  <div class="mid">
  <div class="wheelbox"><div class="pointer"></div><canvas id="c" width="900" height="900"></canvas></div>
  <div class="name" id="name">&nbsp;</div>
  <div class="row">
    <button class="b spin" id="spin">[ spin ]</button>
  </div>
  <div class="count" id="count"></div>
  <div class="who" id="who">
    <button class="b on" data-w="all" type="button">in class + online</button>
    <button class="b" data-w="in_class" type="button">only in class</button>
    <button class="b" data-w="at_home" type="button">only online</button>
    <button class="b" id="refresh" type="button">[ refresh ]</button>
  </div>
  <div class="src" id="src"></div>
  </div>
  </div>
  <div class="foot">
    <button class="link" id="reset">start over today</button>
  </div>
</main>
<script src="../assets/js/config.js?v=20261014a"></script>
<script src="../assets/js/interactive.js?v=20261014a"></script>
<script>
// Wheel of fortune for cold-calling (Can, 07.10: "super simple: the list, spin, here or not here").
// Since 21.10 (Can: "a wheel of the people who signed in, using their nicknames; only those online or in class today
// and no one else"): the wheel = today's sign-ins for the current lecture (deck 👤: poll <LEC>-where, in class / online),
// one entry per device and per nickname, NICKNAMES ONLY (the encrypted name is never read). Lecture: the deck the wheel
// is opened from, else today's lecture (config.js dates), else ?lec=L06. [refresh] = 2 calls (today's sign-ins + the
// nickname list); each nickname text is downloaded once and kept on this device. No timer. The old encrypted class list
// (roster.enc.js) is no longer loaded. A spin takes the picked nickname off the wheel for today (no "here" / "not here"
// buttons since 21.10, Can: "let's kill the 'here' and 'not here' buttons"); "start over today" puts everyone back.
const K = { names: 'wheel-names', day: d => 'wheel-class-' + d };
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const day = new Date().toISOString().slice(0, 10);
let names = [];
let signed = [];   // [{nick, where: 'in_class'|'at_home'}] for today
let whoMode = 'all';
let cls = ls.get(K.day(day)) || [];   // today's called nicknames [{name, t}]
let current = null, angle = 0, spinning = false;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const COLS = ['#E6F5E6', '#FFF9D0', '#FDE4E6', '#E4EFFA', '#F1E6FA', '#E6F3F5'];
const $ = id => document.getElementById(id);

function remaining() { const done = new Set(cls.map(x => x.name)); return names.filter(n => !done.has(n) && n !== current); }  // picked = off today's wheel at once
function save() { ls.set(K.day(day), cls); }
function draw() {
  const R = remaining(), W = cv.width, c = W / 2, r = W / 2 - 10;
  ctx.clearRect(0, 0, W, W);
  if (!R.length) { ctx.font = '600 40px IBM Plex Mono, monospace'; ctx.fillStyle = '#777'; ctx.textAlign = 'center'; ctx.fillText(names.length ? 'everyone has been called' : (loading ? 'loading…' : 'nobody signed in yet'), c, c); return; }
  const seg = 2 * Math.PI / R.length;
  R.forEach((n, i) => {
    const a0 = angle + i * seg;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = COLS[i % COLS.length]; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = R.length > 60 ? 0.5 : 1.5; ctx.stroke();
    ctx.save(); ctx.translate(c, c); ctx.rotate(a0 + seg / 2); ctx.textAlign = 'right'; ctx.fillStyle = '#111';
    const fs = Math.max(9, Math.min(28, 900 / R.length)); ctx.font = fs + 'px IBM Plex Mono, monospace';
    ctx.fillText(n.length > 24 ? n.slice(0, 23) + '…' : n, r - 14, fs / 3); ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c, c, 34, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
}
function picked() {
  const R = remaining(), seg = 2 * Math.PI / R.length;   // the pointer sits at the top (−π/2)
  let a = (-Math.PI / 2 - angle) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI;
  return R[Math.floor(a / seg) % R.length];
}
function spin() {
  if (spinning || !remaining().length) return;
  spinning = true; buttons(); $('name').innerHTML = '&nbsp;';
  // fast (Can, 08.10: "even even smaller"): about 0.5 s, with a short ease-out so the result is readable
  const start = angle, total = 2 * Math.PI * (1 + Math.random()) + Math.random() * 2 * Math.PI, dur = 500, t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur); angle = start + total * (1 - Math.pow(1 - t, 3)); draw();
    // the picked nickname comes off today's wheel at once (Can, 21.10: no "here" / "not here" buttons any more)
    if (t < 1) requestAnimationFrame(step); else { spinning = false; const who = picked(); cls.push({ name: who, t: new Date().toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' }) }); save(); $('name').textContent = who; render(); }
  })(t0);
}
function buttons() { $('spin').disabled = spinning || !remaining().length; }
function render() {
  draw(); buttons();
  $('count').textContent = names.length ? `called today ${cls.filter(x => names.includes(x.name)).length} · on the wheel ${remaining().length}` : '';
}
// today's lecture: the deck around the wheel, else the config date of today (Vienna), else ?lec=
const viennaDay = ts => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ts));
const today = viennaDay(Date.now());
function lecture() {
  const q = /[?&]lec=(L\d\d)/.exec(location.search); if (q) return q[1];
  try { const l = window.parent !== window && window.parent.document.body.dataset.lecture; if (l) return l; } catch (e) {}
  const L = (window.MICRO_CONFIG || {}).lectures || {}; return Object.keys(L).find(k => L[k] === today) || '';
}
const LEC = lecture();
let loading = false;
function applyWho() { names = signed.filter(x => whoMode === 'all' || x.where === whoMode).map(x => x.nick); }
async function load() {
  const P = window.MicroPoll;
  if (!LEC) { $('src').textContent = 'no lecture today (add ?lec=L06 to the address)'; return; }
  if (!P || !P.hasToken) { $('src').textContent = 'could not reach the class data'; return; }
  loading = true; $('refresh').disabled = true; $('src').textContent = 'loading today’s sign-ins…'; render();
  try {
    // 1) today's sign-ins: latest "in class / online" per device, taps of today only
    const by = await P.allAnswers(LEC + '-where/'), latest = {};
    (by[LEC + '-where'] || []).forEach(a => { if (viennaDay(a.ts) !== today) return; if (!latest[a.client] || latest[a.client].ts < a.ts) latest[a.client] = a; });
    // 2) nicknames: the latest sign-in record per device (refs/tags/t/<session>/reg/…); its text holds the nickname
    const reg = {}; (await P.tagRefs('reg/')).forEach(r => { if (r.poll === 'reg' && (!reg[r.client] || reg[r.client].ts < r.ts)) reg[r.client] = r; });
    const devices = Object.keys(latest).filter(c => latest[c].value === 'in_class' || latest[c].value === 'at_home');
    const out = [], seen = new Set(); let noNick = 0;
    for (let i = 0; i < devices.length; i += 8) {
      await Promise.all(devices.slice(i, i + 8).map(async c => {
        const r = reg[c]; if (!r) { noNick++; return; }
        let nick = ''; try { nick = String((await P.blob(r.sha)).nick || '').trim(); } catch (e) {}
        if (!nick) { noNick++; return; }
        const k = nick.toLowerCase(); if (seen.has(k)) return; seen.add(k);   // one entry per nickname (laptop + phone)
        out.push({ nick: nick.slice(0, 30), where: latest[c].value });
      }));
    }
    signed = out.sort((a, b) => a.nick.localeCompare(b.nick));
    const inC = signed.filter(x => x.where === 'in_class').length;
    $('src').textContent = LEC + ' · signed in today: ' + inC + ' in class, ' + (signed.length - inC) + ' online' + (noNick ? ' · ' + noNick + ' device' + (noNick === 1 ? '' : 's') + ' without a nickname' : '') + (P.session !== 'ws26' ? ' · test session' : '');
  } catch (e) { $('src').textContent = 'could not load: tap [ refresh ] again'; }
  loading = false; $('refresh').disabled = false; applyWho(); render();
}
document.querySelectorAll('#who [data-w]').forEach(b => b.onclick = () => { whoMode = b.dataset.w; document.querySelectorAll('#who [data-w]').forEach(x => x.classList.toggle('on', x === b)); applyWho(); render(); });
$('refresh').onclick = load;
$('spin').onclick = spin;
$('reset').onclick = () => { cls = []; current = null; save(); $('name').innerHTML = '&nbsp;'; render(); };
document.addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); spin(); } });
if (/[?&]compact\b/.test(location.search)) document.body.classList.add('compact');
render();
load();
</script>
</body>
</html>
